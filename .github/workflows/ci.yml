name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app alembic
      - run: python -m pytest -q
      - name: Verify Alembic SQL can render offline
        run: python -m alembic upgrade head --sql > "$RUNNER_TEMP/talkbuddy-migrations.sql"
        env:
          DATABASE_URL: postgresql+asyncpg://ci_user:ci_placeholder@localhost:5432/ci_test_db
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  desktop-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop_bridge/requirements.txt
      - run: python -m pip install -r desktop_bridge/requirements.txt pytest
      - run: python -m pytest -q desktop_bridge/tests
